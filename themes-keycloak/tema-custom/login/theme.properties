# SOA 2026 — Keycloak Login Theme Properties
parent=keycloak

# Estilos
styles=css/login.css

# Estilos comunes de Patternfly (necesarios para íconos y base)
stylesCommon=node_modules/patternfly/dist/css/patternfly.min.css node_modules/patternfly/dist/css/patternfly-additions.min.css lib/pficon/pficon.css

# ── Clases del body / layout ──
kcHtmlClass=login-pf
kcBodyClass=login-pf-page

# ── Contenedor principal ──
kcLoginClass=login-pf

# ── Header (realm name, fuera del card) ──
kcHeaderClass=
kcHeaderWrapperClass=

# ── Card ──
kcFormCardClass=card-pf

# ── Header dentro del card ──
kcFormHeaderClass=

# ── Locale / idioma ──
kcLocaleMainClass=login-pf-page-locale
kcLocaleWrapperClass=
kcLocaleDropDownClass=pf-c-dropdown pf-m-align-right
kcLocaleListClass=pf-c-dropdown__menu pf-m-align-right
kcLocaleListItemClass=pf-c-dropdown__menu-item
kcLocaleItemClass=pf-c-dropdown__menu-item

# ── Grupos del formulario ──
kcFormGroupClass=pf-c-form__group
kcFormSettingClass=pf-c-form__group--no-top

# ── Labels ──
kcLabelClass=pf-c-form__label
kcLabelWrapperClass=pf-c-form__label

# ── Inputs ──
kcInputClass=pf-c-form-control
kcInputGroup=pf-c-input-group
kcInputErrorMessageClass=pf-c-form__helper-text pf-m-error

# ── Botones principales ──
kcButtonClass=pf-c-button
kcButtonPrimaryClass=pf-m-primary
kcButtonDefaultClass=pf-m-secondary
kcButtonLargeClass=pf-m-block
kcButtonBlockClass=

# ── Botón ojo (password visibility) ──
kcFormPasswordVisibilityButtonClass=pf-c-button pf-m-control
kcFormPasswordVisibilityIconShow=pficon pficon-eye-open
kcFormPasswordVisibilityIconHide=pficon pficon-eye-slash

# ── Ícono de restart flow (pantalla de password) ──
kcResetFlowIcon=pficon pficon-arrow pf-c-icon

# ── Alertas ──
kcAlertClass=pf-c-alert
kcAlertTitleClass=pf-c-alert__title kc-feedback-text
kcFeedbackSuccessIcon=pficon pficon-ok
kcFeedbackWarningIcon=pficon pficon-warning-triangle-o
kcFeedbackErrorIcon=pficon pficon-error-circle-o
kcFeedbackInfoIcon=pficon pficon-info

# ── Social providers ──
kcFormSocialAccountSectionClass=kc-social-section
kcFormSocialAccountListClass=kc-social-links pf-c-list
kcFormSocialAccountListGridClass=kc-social-grid
kcFormSocialAccountListButtonClass=pf-c-button pf-m-block
kcFormSocialAccountListButtonDisabledClass=pf-m-disabled
kcFormSocialAccountGridItem=kc-social-item
kcFormSocialAccountNameClass=kc-social-provider-name
kcCommonLogoIdP=kc-social-provider-logo

# ── Sign up / info area ──
kcSignUpClass=login-pf-signup
kcInfoAreaWrapperClass=

# ── Opciones del form ──
kcFormOptionsClass=pf-c-form__group
kcFormOptionsWrapperClass=

# ── Content wrapper ──
kcContentWrapperClass=row
kcLabelWrapperClass=col-md-10 col-sm-10

# ── Íconos de feedback (imágenes) ──
# Si querés usar las imágenes PNG del tema, descomentá estas líneas:
# kcFeedbackSuccessIcon=
# kcFeedbackErrorIcon=
